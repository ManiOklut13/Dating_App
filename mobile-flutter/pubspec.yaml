name: younme_mobile
description: "YoUnMe Dating App — Cross-Platform Flutter Mobile Client (v3.2)"
publish_to: "none"
version: 3.2.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP Networking
  dio: ^5.4.3+1

  # State Management
  flutter_riverpod: ^2.5.1

  # Push Notifications (Firebase v3 — compatible with web ^1.x)
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0

  # Secure Storage
  flutter_secure_storage: ^9.2.0

  # UI & Animations
  cached_network_image: ^3.4.0
  flutter_card_swiper: ^7.0.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Navigation
  go_router: ^14.6.0

  # Plan a Date: maps/place search/location/photos/directions
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

  # Date/time formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/younme-logo.png" />
    <link rel="apple-touch-icon" href="/younme-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>YoUnMe — High-Concurrency Social Discovery & Real-Time Dating</title>
    <meta name="description" content="YoUnMe is a next-generation real-time dating platform powered by PostGIS geo-discovery, LiveKit WebRTC audio/video calls, and a secure creator coin economy." />
    <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Tailwind CSS with Romantic Twilight Velvet Palette -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'twilight-start': '#1a0612',
              'twilight-end': '#2b091c',
              'baby-pink': '#ff8da1',
              'dark-pink': '#ff4d88',
              'rose-accent': '#fe728b',
              'plum-dark': '#15040f',
            },
            fontFamily: {
              heading: ['Outfit', 'sans-serif'],
              body: ['Plus Jakarta Sans', 'sans-serif'],
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#0b0d14] text-white antialiased selection:bg-rose-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
